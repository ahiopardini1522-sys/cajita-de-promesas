name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar la parte de Android (si falta)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.ahio --project-name cajita_de_promesas
            rm -f test/widget_test.dart
          fi

      - name: Poner el nombre de la app
        run: sed -i 's/android:label="[^"]*"/android:label="Cajita de Promesas"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cajita-de-promesas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
